[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phonefmt"
version = "0.1.0"
description = "Normalize messy phone number strings to E.164"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["phonefmt*"]
